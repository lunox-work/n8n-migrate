<!doctype html>
<!-- Source of assets/mapping.gif (5 s loop): each kind of n8n workflow migrates from n8n into its place in Claude. Frames
     are drawn by render(t) and assembled by assets/src/gif.mjs; the page also plays by itself.
     The pairs are the analyzer's verdicts on popular templates of rank 1-100 (evals/bench/data/wf, 2026-11-18):
     schedule every 1 d -> cloud-task (Email summary agent); Gmail poll every 1 min -> local-task (Suggest meeting slots
     using AI); chat -> skill (AI agent chat); form -> artifact-form (Flux AI image generator); manual -> artifact
     (Joining different datasets); Telegram, outsiders wait -> hosted (Telegram AI chatbot); MCP server -> replaced
     (Build an MCP server with Google Calendar and custom functions).
     Icons: Lucide (ISC licence, lucide.dev); the n8n and Claude marks: assets/src/logos/SOURCE.md. -->
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: Sans; src: url(fonts/dm-sans-latin-500-normal.woff2); font-weight: 500; }
@font-face { font-family: Display; src: url(fonts/space-grotesk-latin-600-normal.woff2); font-weight: 600; }
* { box-sizing: border-box; margin: 0; }
body { background: #000; }
#scene { position: relative; width: 960px; height: 540px; background: #08080b; color: #f4f4f5; font-family: Sans; overflow: hidden; }
.panel { position: absolute; top: 84px; width: 300px; height: 430px; border-radius: 22px; background: #0f0f13; border: 1px solid #202026; }
.pill { position: absolute; top: 26px; height: 38px; padding: 0 16px 0 12px; border-radius: 999px; display: flex; align-items: center; gap: 10px; font-family: Display; font-size: 18px; background: #141418; border: 1px solid #25252b; }
#bridge { position: absolute; left: 444px; top: 22px; width: 72px; height: 46px; display: flex; align-items: center; justify-content: center; }
#bridge img { width: 46px; height: 46px; }
.track { position: absolute; height: 2px; background-image: linear-gradient(90deg, #26262c 50%, transparent 50%); background-size: 10px 2px; }
.row { position: absolute; height: 52px; display: flex; align-items: center; gap: 14px; font-size: 15px; }
.row.l { left: 40px; width: 240px; flex-direction: row-reverse; justify-content: flex-start; color: #d4d4d8; }
.row.r { left: 682px; width: 240px; color: #71717a; }
.chip { width: 52px; height: 52px; border-radius: 15px; display: grid; place-items: center; position: relative; flex: none; }
.chip svg { width: 24px; height: 24px; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; position: absolute; left: 50%; top: 50%; margin: -12px 0 0 -12px; }
.n8nchip { background: #f4f4f5; }
.slot { border: 1.5px dashed #34343c; }
.slot svg { stroke: #4b4b54; }
#movers .chip { position: absolute; z-index: 3; }
</style>
</head>

<script>
const L = {
  clock: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
  mail: '<rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>',
  chat: '<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>',
  form: '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/>',
  play: '<circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/>',
  send: '<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
  plug: '<path d="M12 22v-5"/><path d="M9 8V2"/><path d="M15 8V2"/><path d="M18 8v5a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V8Z"/>',
  cloud: '<path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>',
  monitor: '<rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/>',
  sparkles: '<path d="M9.94 15.5A2 2 0 0 0 8.5 14.06l-6.14-1.58a.5.5 0 0 1 0-.96L8.5 9.94A2 2 0 0 0 9.94 8.5l1.58-6.14a.5.5 0 0 1 .96 0L14.06 8.5A2 2 0 0 0 15.5 9.94l6.14 1.58a.5.5 0 0 1 0 .96L15.5 14.06a2 2 0 0 0-1.44 1.44l-1.58 6.14a.5.5 0 0 1-.96 0z"/>',
  window: '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 9h20"/><path d="M7 13h5"/><path d="M7 16h8"/>',
  chart: '<path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/>',
  server: '<rect width="20" height="8" x="2" y="2" rx="2"/><rect width="20" height="8" x="2" y="14" rx="2"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/>',
  link: '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
};
const ROWS = [
  { from: ["clock", "Schedule", [249, 115, 22]], to: ["cloud", "Cloud task"], tone: "ok" },
  { from: ["mail", "Gmail poll", [239, 68, 68]], to: ["monitor", "Desktop task"], tone: "ok" },
  { from: ["chat", "Chat", [139, 92, 246]], to: ["sparkles", "Skill"], tone: "ok" },
  { from: ["form", "Form", [20, 184, 166]], to: ["window", "Artifact form"], tone: "ok" },
  { from: ["play", "Manual run", [82, 82, 91]], to: ["chart", "Run now page"], tone: "ok" },
  { from: ["send", "Telegram bot", [14, 165, 233]], to: ["server", "Needs hosting"], tone: "warn" },
  { from: ["plug", "MCP server", [99, 102, 241]], to: ["link", "Connectors"], tone: "info" },
];
const TONE = { ok: [16, 185, 129], warn: [245, 158, 11], info: [59, 130, 246] };
const WHITE = [244, 244, 245];
const rgb = (c, a = 1) => `rgb(${c[0]} ${c[1]} ${c[2]} / ${a})`;
const mix = (a, b, k) => a.map((v, i) => Math.round(v + (b[i] - v) * k));
const svg = (k, stroke, op = 1) => `<svg viewBox="0 0 24 24" style="stroke:${stroke};opacity:${op}">${L[k]}</svg>`;
const Y = (i) => 108 + i * 57, LCX = 228, RCX = 682;
document.getElementById("tracks").innerHTML = ROWS.map((_, i) => `<div class="track" style="left:${LCX + 64}px;width:${RCX - LCX - 76}px;top:${Y(i) + 25}px"></div>`).join("");
document.getElementById("left").innerHTML = ROWS.map((r, i) => `<div class="row l" style="top:${Y(i)}px"><div class="chip n8nchip" id="lc${i}">${svg(r.from[0], rgb(r.from[2]))}</div><span id="ll${i}">${r.from[1]}</span></div>`).join("");
document.getElementById("right").innerHTML = ROWS.map((r, i) => `<div class="row r" style="top:${Y(i)}px"><div class="chip slot" id="rc${i}">${svg(r.to[0], "#4b4b54")}</div><span id="rl${i}">${r.to[1]}</span></div>`).join("");
document.getElementById("movers").innerHTML = ROWS.map((r, i) => `<div class="chip" id="m${i}"><span class="a">${svg(r.from[0], rgb(r.from[2]))}</span><span class="b">${svg(r.to[0], "#ffffff", 0)}</span></div>`).join("");

const DURATION = 5, START = 0.35, GAP = 0.3, TRAVEL = 1.5, BACK = 4.45;
const clamp = (x) => Math.max(0, Math.min(1, x));
const smooth = (x) => x * x * x * (x * (x * 6 - 15) + 10); // smootherstep: no overshoot, no jerk
window.render = (t) => {
  const back = smooth(clamp((t - BACK) / (DURATION - BACK))); // quietly return to the start for the loop
  ROWS.forEach((r, i) => {
    const k = clamp((t - START - i * GAP) / TRAVEL), e = smooth(k);
    const m = document.getElementById(`m${i}`), lc = document.getElementById(`lc${i}`), rc = document.getElementById(`rc${i}`);
    const ll = document.getElementById(`ll${i}`), rl = document.getElementById(`rl${i}`);
    const arrived = k >= 1;
    // the travelling chip: glides on a shallow arc and turns from its n8n form into its Claude form on the way
    const flying = k > 0 && !arrived;
    m.style.display = flying ? "grid" : "none";
    if (flying) {
      const x = LCX + (RCX - LCX) * e, y = Y(i) - Math.sin(Math.PI * e) * 14;
      m.style.left = `${x}px`; m.style.top = `${y}px`;
      const c = smooth(clamp((e - 0.25) / 0.5));
      m.style.background = rgb(mix(WHITE, TONE[r.tone], c));
      m.querySelector(".a svg").style.opacity = 1 - c;
      m.querySelector(".b svg").style.opacity = c;
    }
    // what it leaves behind, and the slot it settles into
    const gone = k > 0 ? 1 - back : 0;
    lc.style.opacity = 1 - 0.75 * gone; ll.style.opacity = 1 - 0.6 * gone;
    const fill = arrived ? 1 - back : 0;
    rc.style.background = fill ? rgb(TONE[r.tone], fill) : "";
    rc.style.borderColor = fill ? rgb(TONE[r.tone], fill) : "";
    rc.querySelector("svg").style.stroke = fill ? rgb(mix([75, 75, 84], [255, 255, 255], fill)) : "";
    rl.style.color = rgb(mix([113, 113, 122], [244, 244, 245], fill));
  });
};
window.DURATION = DURATION;
if (!window.__frames) {
  const t0 = performance.now();
  const tick = () => { render(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(tick); };
  document.fonts.ready.then(tick);
}
</script>
