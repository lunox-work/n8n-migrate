<!doctype html>
<!-- Source of assets/mapping.gif (5 s loop): each kind of n8n workflow flies through n8n-to-claude to where it lands in
     Claude. Frames are drawn by render(t) and assembled by assets/src/gif.mjs; the page also plays by itself.
     The pairs are the analyzer's verdicts on popular templates of rank 1-100 (evals/bench/data/wf, 2026-11-18):
     schedule every 1 d -> cloud-task (Email summary agent); Gmail poll every 1 min -> local-task (Suggest meeting slots
     using AI); chat -> skill (AI agent chat); form -> artifact-form (Flux AI image generator); manual -> artifact
     (Joining different datasets); Telegram, outsiders wait -> hosted (Telegram AI chatbot); MCP server -> replaced
     (Build an MCP server with Google Calendar and custom functions). The n8n and Claude marks: assets/src/logos/SOURCE.md;
     the other icons are drawn here. -->
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: Mono; src: url(fonts/dm-mono-latin-500-normal.woff2); font-weight: 500; }
@font-face { font-family: Sans; src: url(fonts/dm-sans-latin-500-normal.woff2); font-weight: 500; }
@font-face { font-family: Display; src: url(fonts/space-grotesk-latin-600-normal.woff2); font-weight: 600; }
:root { --text: #f4f4f5; --muted: #8b8b94; --n8n: #ea4b71; --claude: #d97757; }
* { box-sizing: border-box; margin: 0; }
body { background: #000; }
#scene { position: relative; width: 960px; height: 540px; background: #07070a; color: var(--text); font-family: Sans; overflow: hidden; }
.panel { position: absolute; top: 76px; width: 262px; height: 432px; border-radius: 22px; background: #0f0f13; border: 1px solid #222228; box-shadow: inset 0 1px 0 #2a2a31; }
.panel.n8n { left: 28px; }
.panel.n8n::after { content: ""; position: absolute; inset: 0; border-radius: 22px; background-image: radial-gradient(#26262c 1px, transparent 1.5px); background-size: 14px 14px; }
.panel.claude { left: 670px; }
.pill { position: absolute; top: 26px; height: 36px; padding: 0 15px 0 11px; border-radius: 999px; display: flex; align-items: center; gap: 9px; font-family: Display; font-size: 17px; background: #141418; border: 1px solid #26262c; }
.pill svg { width: 23px; height: 23px; }
.node { position: absolute; left: 46px; width: 226px; height: 48px; display: flex; align-items: center; justify-content: flex-end; gap: 12px; font-size: 14.5px; color: #e4e4e7; }
.chip { width: 48px; height: 48px; border-radius: 13px; background: #f4f4f5; display: grid; place-items: center; position: relative; flex: none; }
.chip svg { width: 25px; height: 25px; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.handle { position: absolute; right: -6px; top: 18px; width: 12px; height: 12px; border-radius: 50%; background: #07070a; border: 2px solid #a1a1aa; }
.tile { position: absolute; left: 688px; width: 226px; height: 48px; border-radius: 14px; display: flex; align-items: center; gap: 12px; padding: 0 10px 0 6px; background: #15151a; border: 1px solid #24242a; font-size: 14.5px; color: #a1a1aa; }
.tile .sq { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: #1c1c21; flex: none; }
.tile .sq svg { width: 20px; height: 20px; fill: none; stroke: #71717a; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tile .badge { margin-left: auto; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; transform: scale(0); }
.tile .badge svg { width: 12px; height: 12px; fill: none; stroke: #07070a; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
#hubwrap { position: absolute; left: 432px; top: 248px; width: 96px; height: 96px; }
#hub { width: 96px; height: 96px; border-radius: 24px; padding: 12px; background: #16161b; border: 1px solid #2a2a31; box-shadow: 0 0 0 6px #121216; }
#hub img { width: 100%; height: 100%; display: block; }
#fx { position: absolute; inset: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="scene">
  <div class="panel n8n"></div>
  <div class="panel claude"></div>
  <div class="pill" style="left:28px"><svg viewBox="0 0 24 24"><path fill="#EA4B71" d="M21.4737 5.6842c-1.1772 0-2.1663.8051-2.4468 1.8947h-2.8955c-1.235 0-2.289.893-2.492 2.111l-.1038.623a1.263 1.263 0 0 1-1.246 1.0555H11.289c-.2805-1.0896-1.2696-1.8947-2.4468-1.8947s-2.1663.8051-2.4467 1.8947H4.973c-.2805-1.0896-1.2696-1.8947-2.4468-1.8947C1.1311 9.4737 0 10.6047 0 12s1.131 2.5263 2.5263 2.5263c1.1772 0 2.1663-.8051 2.4468-1.8947h1.4223c.2804 1.0896 1.2696 1.8947 2.4467 1.8947 1.1772 0 2.1663-.8051 2.4468-1.8947h1.0008a1.263 1.263 0 0 1 1.2459 1.0555l.1038.623c.203 1.218 1.257 2.111 2.492 2.111h.3692c.2804 1.0895 1.2696 1.8947 2.4468 1.8947 1.3952 0 2.5263-1.131 2.5263-2.5263s-1.131-2.5263-2.5263-2.5263c-1.1772 0-2.1664.805-2.4468 1.8947h-.3692a1.263 1.263 0 0 1-1.246-1.0555l-.1037-.623A2.52 2.52 0 0 0 13.9607 12a2.52 2.52 0 0 0 .821-1.4794l.1038-.623a1.263 1.263 0 0 1 1.2459-1.0555h2.8955c.2805 1.0896 1.2696 1.8947 2.4468 1.8947 1.3952 0 2.5263-1.131 2.5263-2.5263s-1.131-2.5263-2.5263-2.5263m0 1.2632a1.263 1.263 0 0 1 1.2631 1.2631 1.263 1.263 0 0 1-1.2631 1.2632 1.263 1.263 0 0 1-1.2632-1.2632 1.263 1.263 0 0 1 1.2632-1.2631M2.5263 10.7368A1.263 1.263 0 0 1 3.7895 12a1.263 1.263 0 0 1-1.2632 1.2632A1.263 1.263 0 0 1 1.2632 12a1.263 1.263 0 0 1 1.2631-1.2632m6.3158 0A1.263 1.263 0 0 1 10.1053 12a1.263 1.263 0 0 1-1.2632 1.2632A1.263 1.263 0 0 1 7.579 12a1.263 1.263 0 0 1 1.2632-1.2632m10.1053 3.7895a1.263 1.263 0 0 1 1.2631 1.2632 1.263 1.263 0 0 1-1.2631 1.2631 1.263 1.263 0 0 1-1.2632-1.2631 1.263 1.263 0 0 1 1.2632-1.2632"/></svg>n8n</div>
  <div class="pill" style="left:670px"><svg viewBox="0 0 24 24"><path fill="#D97757" d="m4.7144 15.9555 4.7174-2.6471.079-.2307-.079-.1275h-.2307l-.7893-.0486-2.6956-.0729-2.3375-.0971-2.2646-.1214-.5707-.1215-.5343-.7042.0546-.3522.4797-.3218.686.0608 1.5179.1032 2.2767.1578 1.6514.0972 2.4468.255h.3886l.0546-.1579-.1336-.0971-.1032-.0972L6.973 9.8356l-2.55-1.6879-1.3356-.9714-.7225-.4918-.3643-.4614-.1578-1.0078.6557-.7225.8803.0607.2246.0607.8925.686 1.9064 1.4754 2.4893 1.8336.3643.3035.1457-.1032.0182-.0728-.164-.2733-1.3539-2.4467-1.445-2.4893-.6435-1.032-.17-.6194c-.0607-.255-.1032-.4674-.1032-.7285L6.287.1335 6.6997 0l.9957.1336.419.3642.6192 1.4147 1.0018 2.2282 1.5543 3.0296.4553.8985.2429.8318.091.255h.1579v-.1457l.1275-1.706.2368-2.0947.2307-2.6957.0789-.7589.3764-.9107.7468-.4918.5828.2793.4797.686-.0668.4433-.2853 1.8517-.5586 2.9021-.3643 1.9429h.2125l.2429-.2429.9835-1.3053 1.6514-2.0643.7286-.8196.85-.9046.5464-.4311h1.0321l.759 1.1293-.34 1.1657-1.0625 1.3478-.8804 1.1414-1.2628 1.7-.7893 1.36.0729.1093.1882-.0183 2.8535-.607 1.5421-.2794 1.8396-.3157.8318.3886.091.3946-.3278.8075-1.967.4857-2.3072.4614-3.4364.8136-.0425.0304.0486.0607 1.5482.1457.6618.0364h1.621l3.0175.2247.7892.522.4736.6376-.079.4857-1.2142.6193-1.6393-.3886-3.825-.9107-1.3113-.3279h-.1822v.1093l1.0929 1.0686 2.0035 1.8092 2.5075 2.3314.1275.5768-.3218.4554-.34-.0486-2.2039-1.6575-.85-.7468-1.9246-1.621h-.1275v.17l.4432.6496 2.3436 3.5214.1214 1.0807-.17.3521-.6071.2125-.6679-.1214-1.3721-1.9246L14.38 17.959l-1.1414-1.9428-.1397.079-.674 7.2552-.3156.3703-.7286.2793-.6071-.4614-.3218-.7468.3218-1.4753.3886-1.9246.3157-1.53.2853-1.9004.17-.6314-.0121-.0425-.1397.0182-1.4328 1.9672-2.1796 2.9446-1.7243 1.8456-.4128.164-.7164-.3704.0667-.6618.4008-.5889 2.386-3.0357 1.4389-1.882.929-1.0868-.0062-.1579h-.0546l-6.3385 4.1164-1.1293.1457-.4857-.4554.0608-.7467.2307-.2429 1.9064-1.3114Z"/></svg>Claude</div>
  <svg id="fx" width="960" height="540"><defs id="defs"></defs><g id="guides"></g><g id="lines"></g><g id="rings"></g><g id="comets"></g></svg>
  <div id="hubwrap"><div id="hub"><img src="../icon.svg" alt=""></div></div>
  <div id="nodes"></div>
  <div id="tiles"></div>
</div>
<script>
const I = {
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  mail: '<rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 7l8.5 6 8.5-6"/>',
  chat: '<path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H9l-5 4z"/>',
  form: '<rect x="4" y="3" width="16" height="18" rx="2.5"/><path d="M8 8h8M8 12h8M8 16h5"/>',
  play: '<circle cx="12" cy="12" r="9"/><path d="M10 8.5l5 3.5-5 3.5z"/>',
  send: '<path d="M21 3L3 10.5l7 2.5 2.5 7z"/><path d="M10 13l11-10"/>',
  plug: '<path d="M9 3v5M15 3v5M6 8h12v3a6 6 0 0 1-12 0zM12 17v4"/>',
  cloud: '<path d="M7 18a4.5 4.5 0 0 1-.5-9A6 6 0 0 1 18 9.5a4 4 0 0 1-1 8.5z"/>',
  monitor: '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M9 20h6M12 16v4"/>',
  spark: '<path d="M12 3l2 5.5L19.5 10 14 12l-2 6-2-6-5.5-2L10 8.5z"/>',
  page: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M7 13h4M7 16h7"/>',
  bars: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 16v-4M12 16V8M16 16v-6"/>',
  server: '<rect x="4" y="4" width="16" height="6" rx="1.5"/><rect x="4" y="14" width="16" height="6" rx="1.5"/><path d="M8 7h.01M8 17h.01"/>',
  link: '<path d="M10 14a4 4 0 0 0 5.6 0l3-3a4 4 0 0 0-5.6-5.6l-1 1M14 10a4 4 0 0 0-5.6 0l-3 3a4 4 0 0 0 5.6 5.6l1-1"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
};
// from: [icon, label, glyph colour]; to: [icon, label]; tone: verdict colour.
const ROWS = [
  { from: ["clock", "Schedule", "#f97316"], to: ["cloud", "Cloud task"], tone: "ok" },
  { from: ["mail", "Gmail poll", "#ef4444"], to: ["monitor", "Desktop task"], tone: "ok" },
  { from: ["chat", "Chat", "#8b5cf6"], to: ["spark", "Skill"], tone: "ok" },
  { from: ["form", "Form", "#14b8a6"], to: ["page", "Artifact form"], tone: "ok" },
  { from: ["play", "Manual run", "#52525b"], to: ["bars", "Run now page"], tone: "ok" },
  { from: ["send", "Telegram bot", "#0ea5e9"], to: ["server", "Needs hosting"], tone: "warn" },
  { from: ["plug", "MCP server", "#6366f1"], to: ["link", "Connectors"], tone: "info" },
];
const C = { ok: [52, 211, 153], warn: [251, 191, 36], info: [96, 165, 250] };
const N8N = [234, 75, 113];
const rgb = (c, a = 1) => `rgb(${c[0]} ${c[1]} ${c[2]} / ${a})`;
const Y = (i) => 112 + i * 56, HX = 480, HY = 296, X1 = 278, X2 = 688;
const icon = (k, stroke) => `<svg viewBox="0 0 24 24" style="${stroke ? `stroke:${stroke}` : ""}">${I[k]}</svg>`;
document.getElementById("nodes").innerHTML = ROWS.map((r, i) => `<div class="node" style="top:${Y(i)}px">${r.from[1]}<div class="chip">${icon(r.from[0], r.from[2])}<i class="handle"></i></div></div>`).join("");
document.getElementById("tiles").innerHTML = ROWS.map((r, i) => `<div class="tile" id="t${i}" style="top:${Y(i)}px"><div class="sq">${icon(r.to[0])}</div><span>${r.to[1]}</span><div class="badge" style="background:${rgb(C[r.tone])}">${r.tone === "warn" ? '<b style="color:#07070a;font:700 13px/1 Sans">!</b>' : icon("check")}</div></div>`).join("");
const d = (i) => { const y = Y(i) + 24; return `M${X1} ${y} C ${375} ${y}, ${395} ${HY}, ${HX} ${HY} C ${565} ${HY}, ${590} ${y}, ${X2} ${y}`; };
const ns = "http://www.w3.org/2000/svg";
document.getElementById("defs").innerHTML = ROWS.map((r, i) => `<linearGradient id="g${i}" gradientUnits="userSpaceOnUse" x1="${X1}" y1="0" x2="${X2}" y2="0"><stop offset="0" stop-color="${rgb(N8N)}"/><stop offset="0.5" stop-color="#e8e8ef"/><stop offset="1" stop-color="${rgb(C[r.tone])}"/></linearGradient>`).join("");
document.getElementById("guides").innerHTML = ROWS.map((_, i) => `<path d="${d(i)}" fill="none" stroke="rgb(255 255 255 / 0.07)" stroke-width="1.5" stroke-dasharray="3 5"/>`).join("");
document.getElementById("lines").innerHTML = ROWS.map((_, i) => `<path id="p${i}" d="${d(i)}" fill="none" stroke="url(#g${i})" stroke-width="2.4" stroke-linecap="round"/>`).join("");
const TAIL = 16;
document.getElementById("comets").innerHTML = ROWS.map((r, i) => Array.from({ length: TAIL }, (_, j) => `<circle id="c${i}_${j}" r="${6 - j * 0.32}" fill="${j === 0 ? "#ffffff" : rgb(C[r.tone], 0.8 - j * 0.048)}"/>`).join("")).join("");
document.getElementById("rings").innerHTML = ROWS.map((r, i) => `<circle id="hr${i}" cx="${HX}" cy="${HY}" fill="none" stroke-width="2"/><circle id="lr${i}" cx="${X2 + 24}" cy="${Y(i) + 24}" fill="none" stroke-width="2"/>`).join("");
const LEN = ROWS.map((_, i) => document.getElementById(`p${i}`).getTotalLength());

const DURATION = 5, START = 0.25, GAP = 0.28, FLY = 0.95, FADE_AT = 4.5;
const clamp = (x) => Math.max(0, Math.min(1, x));
const easeIO = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const back = (x) => { const c = 2.2; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
window.render = (t) => {
  const out = clamp((t - FADE_AT) / (DURATION - FADE_AT));
  let pulse = 0;
  ROWS.forEach((r, i) => {
    const s = START + i * GAP, k = clamp((t - s) / FLY), e = easeIO(k);
    const p = document.getElementById(`p${i}`);
    p.style.strokeDasharray = LEN[i];
    p.style.strokeDashoffset = LEN[i] * (1 - e);
    p.style.opacity = (k > 0 ? 0.85 : 0) * (1 - out);
    const flying = k > 0 && k < 1;
    for (let j = 0; j < TAIL; j++) {
      const c = document.getElementById(`c${i}_${j}`);
      const at = e - j * 0.0075;
      if (!flying || at <= 0) { c.style.display = "none"; continue; }
      const pt = p.getPointAtLength(LEN[i] * at);
      c.style.display = ""; c.setAttribute("cx", pt.x); c.setAttribute("cy", pt.y);
    }
    // a ring leaves the hub as the comet passes it, another where it lands
    const hr = document.getElementById(`hr${i}`), hk = clamp((t - (s + FLY * 0.5)) / 0.55);
    hr.setAttribute("r", 50 + 46 * easeIO(hk)); hr.setAttribute("stroke", rgb(C[r.tone], hk > 0 && hk < 1 ? 0.6 * (1 - hk) : 0));
    if (flying) pulse = Math.max(pulse, 1 - Math.min(1, Math.abs(e - 0.5) * 5));
    const land = clamp((t - (s + FLY)) / 0.35);
    const lr = document.getElementById(`lr${i}`);
    lr.setAttribute("r", 20 + 22 * easeIO(land)); lr.setAttribute("stroke", rgb(C[r.tone], land > 0 && land < 1 ? 0.7 * (1 - land) : 0));
    const tile = document.getElementById(`t${i}`), sq = tile.querySelector(".sq"), badge = tile.querySelector(".badge");
    const on = (land > 0 ? 1 : 0) * (1 - out);
    tile.style.borderColor = on ? rgb(C[r.tone], 0.45 * on) : "";
    tile.style.background = on ? rgb(C[r.tone], 0.12 * on) : "";
    tile.style.color = on ? `rgb(244 244 245 / ${0.6 + 0.4 * on})` : "";
    tile.style.transform = land > 0 && land < 1 ? `scale(${1 + 0.05 * Math.sin(Math.PI * land)})` : "";
    sq.style.background = on ? rgb(C[r.tone], 0.95 * on) : "";
    sq.querySelector("svg").style.stroke = on ? "#07070a" : "";
    badge.style.transform = `scale(${land > 0 ? back(clamp(land * 1.2)) * (1 - out) : 0})`;
  });
  document.getElementById("hubwrap").style.transform = `scale(${1 + 0.07 * pulse})`;
  document.getElementById("hub").style.boxShadow = `0 0 0 6px #121216, 0 0 0 ${7 + 3 * pulse}px rgb(234 75 113 / ${0.15 + 0.5 * pulse})`;
};
window.DURATION = DURATION;
if (!window.__frames) {
  const t0 = performance.now();
  const tick = () => { render(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(tick); };
  document.fonts.ready.then(tick);
}
</script>
</body>
</html>
