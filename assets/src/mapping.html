     The pairs are the analyzer's verdicts on popular templates of rank 1-100 (evals/bench/data/wf, 2026-11-18):
     schedule every 1 d -> cloud-task (Email summary agent); Gmail poll every 1 min -> local-task (Suggest meeting slots
     using AI); chat -> skill (AI agent chat); form -> artifact-form (Flux AI image generator); manual -> artifact

     functions).

<script>

const ROWS = [
  ["clock", "Schedule", "cloud", "Cloud task"],
  ["gmail", "Gmail", "desktop", "Desktop task"],
  ["chat", "Chat", "sparkle", "Skill"],
  ["form", "Form", "window", "Form page"],
  ["play", "Manual run", "click", "One-click page"],
  ["telegram", "Telegram message", "key", "Claude API"],
  ["mcp", "MCP server", "plugs", "Connectors"],
];
const outline = (k) => ICONS.brand[k]
  ? `<svg class="si" viewBox="0 0 24 24"><path d="${ICONS.brand[k]}"/></svg>`
  : `<svg viewBox="0 0 24 24">${LUCIDE[k]}</svg>`;

const $ = (id) => document.getElementById(id);
const els = ROWS.map((_, i) => ({ a: $(`a${i}`), t: $(`t${i}`), l: $(`l${i}`), f: $(`f${i}`), fl: $(`fl${i}`), fi: $(`f${i}`).querySelector("svg") }));
const rgb = (c) => `rgb(${c[0]} ${c[1]} ${c[2]})`;
const mix = (a, b, k) => a.map((v, i) => Math.round(v + (b[i] - v) * k));

// One quick cascade on the iOS sheet curve: each arrow draws, then its Claude tile settles in from slightly small and
// soft, and the n8n row it came from dims. Rows start 80 ms apart; the full map holds, then everything fades together for the loop.
const DURATION = 2.8, START = 0.12, STAGGER = 0.08, HOLD = 2.3, FADE = 0.4;
const clamp = (x) => Math.max(0, Math.min(1, x));
const bezier = (x1, y1, x2, y2) => (x) => { // CSS cubic-bezier, solved by bisection
  let lo = 0, hi = 1, u = x;
  for (let n = 0; n < 24; n++) { const v = 3 * (1 - u) ** 2 * u * x1 + 3 * (1 - u) * u * u * x2 + u ** 3; if (v < x) lo = u; else hi = u; u = (lo + hi) / 2; }
  return 3 * (1 - u) ** 2 * u * y1 + 3 * (1 - u) * u * u * y2 + u ** 3;
};
const spring = bezier(0.32, 0.72, 0, 1);
const ease = bezier(0.25, 0.1, 0.25, 1);
const ramp = (t, t0, len, f = ease) => f(clamp((t - t0) / len));

window.render = (t) => {
  const keep = 1 - ramp(t, HOLD, FADE);
  els.forEach((E, i) => {
    const t0 = START + i * STAGGER;
    E.a.style.strokeDashoffset = 1 - ramp(t, t0, 0.38, spring);
    E.a.parentNode.style.opacity = keep;
    const s = ramp(t, t0 + 0.14, 0.5, spring) * keep;
    E.t.style.opacity = s;
    E.t.style.transform = `scale(${0.72 + 0.28 * s})`;
    E.t.style.filter = s < 0.995 ? `blur(${(1 - s) * 4}px)` : "none";
    const l = ramp(t, t0 + 0.2, 0.45, spring) * keep;
    E.l.style.opacity = l;
    E.l.style.transform = `translateX(${(1 - l) * -8}px)`;
    // once its Claude form is in place, the n8n row steps back
    const m = ramp(t, t0 + 0.3, 0.5) * keep, grey = rgb(mix([142, 142, 147], [72, 72, 74], m));
    E.fl.style.color = grey;
    E.fi.style[E.fi.classList.contains("si") ? "fill" : "stroke"] = grey;
    E.f.style.borderColor = rgb(mix([44, 44, 46], [28, 28, 30], m));
  });
};
window.DURATION = DURATION;

  const t0 = performance.now();
  const tick = () => { render(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(tick); };
